<!doctype html>
<html lang="es" data-active-lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Proyecciones del Mito — Harmonic Beacon</title>
<meta name="description" lang="es" content="Galería viva del mito colectivo: cada proyección nace de una imagen y un sentir, reinterpretados como visión." />
<meta name="description" lang="en" content="A living gallery of the collective myth: each projection is born from an image and a feeling, reinterpreted as vision." />
<meta name="theme-color" content="#F5EFE4" />
<meta property="og:title" content="Proyecciones del Mito — Harmonic Beacon" />
<meta property="og:description" content="Galería viva del mito colectivo." />
<meta property="og:type" content="website" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=Marcellus&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        serif: ['"Cormorant Garamond"', 'serif'],
        display: ['Marcellus', 'serif'],
        sans: ['Inter', 'system-ui', 'sans-serif'],
      },
      colors: {
        pearl: { 50:'#FBF8F2', 100:'#F5EFE4', 200:'#EDE3D2', 300:'#E0D2BA', 400:'#CFBC9B', 500:'#B8A07B' },
        ink:   { 900:'#2A2118', 800:'#3A2E22', 700:'#4A3D2E', 600:'#6B5C49', 500:'#8C7F6C' },
        gold:  { DEFAULT:'#C9A24E', soft:'#E3C77E', deep:'#A07E33' },
      },
    },
  },
};
</script>
<style>
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #FBF8F2 0%, #F5EFE4 45%, #EDE3D2 100%);
    color:#3A2E22;
    min-height:100vh;
  }
  .grain{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image: radial-gradient(rgba(74,61,46,.5) .5px, transparent .5px);
    background-size: 3px 3px; opacity:.05; mix-blend-mode:multiply;
  }
  .eyebrow{ text-transform:uppercase; letter-spacing:.34em; font-size:11px; font-weight:500; color:#A07E33; }
  .rule{ width:64px; height:1px; background:linear-gradient(90deg,transparent,#C9A24E,transparent); border:0; }
  .card{
    opacity:0; transform:translateY(14px);
    transition:opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1);
    transition-delay: var(--d, 0ms);
  }
  .card.in{ opacity:1; transform:none; }
  .card img{ transition:transform .9s cubic-bezier(.16,1,.3,1), filter .9s; }
  .card:hover img{ transform:scale(1.04); filter:saturate(1.06); }
  @media (prefers-reduced-motion: reduce){
    .card{ opacity:1; transform:none; transition:none; }
    .card img{ transition:none; }
  }
</style>
</head>
<body class="font-sans antialiased">
<div class="grain"></div>

<main class="relative z-10 max-w-6xl mx-auto px-5 sm:px-8 pb-24">

  <!-- Header -->
  <header class="pt-10 sm:pt-14 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3 group">
      <svg class="w-7 h-7 text-gold" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="24" cy="24" r="9" fill="currentColor" opacity=".9"/>
        <path d="M24 4c-7 9-7 31 0 40M24 4c7 9 7 31 0 40" stroke="currentColor" stroke-width="1.1" opacity=".5"/>
        <ellipse cx="24" cy="24" rx="21" ry="9" stroke="currentColor" stroke-width="1.1" opacity=".5"/>
      </svg>
      <span class="font-sans font-semibold uppercase tracking-[.18em] text-sm text-ink-900 group-hover:text-gold-deep transition">Harmonic Beacon</span>
    </a>
    <a href="/" class="text-xs uppercase tracking-[.16em] text-ink-600 hover:text-gold-deep transition">← Inicio</a>
  </header>

  <!-- Intro -->
  <section class="text-center pt-16 sm:pt-24 pb-12">
    <p class="eyebrow">Galería viva</p>
    <h1 class="font-display text-4xl sm:text-6xl text-ink-900 mt-5 leading-[1.05]">Proyecciones del Mito</h1>
    <hr class="rule mx-auto my-7" />
    <p class="font-serif italic text-xl sm:text-2xl text-ink-700 max-w-2xl mx-auto leading-snug">
      Cada imagen nació de una foto y un sentir, reinterpretados como visión.
      Un mito que se teje entre todes.
    </p>
  </section>

  <!-- Galería -->
  <section id="gallery" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4"></section>

  <!-- Estado vacío -->
  <div id="empty" class="hidden text-center py-24">
    <p class="font-serif italic text-2xl text-ink-600">La galería está despertando.</p>
    <p class="text-sm text-ink-500 mt-3">Pronto las primeras proyecciones aparecerán aquí.</p>
  </div>

  <!-- Footer -->
  <footer class="text-center pt-20">
    <hr class="rule mx-auto mb-6" />
    <p class="text-xs uppercase tracking-[.2em] text-ink-500">Harmonic Beacon · Proyección del Mito Personal</p>
  </footer>
</main>

<!-- Lightbox -->
<div id="lightbox" class="hidden fixed inset-0 z-50 bg-ink-900/85 backdrop-blur-sm items-center justify-center p-6 cursor-zoom-out">
  <img id="lightbox-img" class="max-w-full max-h-full rounded-lg shadow-2xl" alt="Proyección" />
</div>

<script>
(async function () {
  const gallery = document.getElementById('gallery');
  const empty = document.getElementById('empty');
  let items = [];
  try {
    const res = await fetch('proyecciones.json?v=' + Date.now());
    items = await res.json();
  } catch (e) { items = []; }

  if (!Array.isArray(items) || items.length === 0) {
    gallery.classList.add('hidden');
    empty.classList.remove('hidden');
    return;
  }

  // más nuevas primero
  items.reverse();

  items.forEach((it, i) => {
    const a = document.createElement('button');
    a.className = 'card relative block aspect-square overflow-hidden rounded-lg sm:rounded-xl bg-pearl-200 shadow-[0_14px_40px_rgba(74,61,46,.16)] focus:outline-none focus:ring-2 focus:ring-gold';
    a.style.setProperty('--d', (i % 8) * 70 + 'ms');
    const img = document.createElement('img');
    img.src = 'img/' + it.file;
    img.alt = 'Proyección del mito';
    img.loading = 'lazy';
    img.className = 'w-full h-full object-cover';
    a.appendChild(img);
    a.addEventListener('click', () => openLightbox(img.src));
    gallery.appendChild(a);
  });

  // reveal on scroll
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: .12 });
  document.querySelectorAll('.card').forEach(c => io.observe(c));

  // lightbox
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lightbox-img');
  function openLightbox(src){ lbImg.src = src; lb.classList.remove('hidden'); lb.classList.add('flex'); }
  lb.addEventListener('click', () => { lb.classList.add('hidden'); lb.classList.remove('flex'); });
})();
</script>
</body>
</html>
