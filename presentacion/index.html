/* ---------- Símbolo Lissajous 3:2 (perla / Beacon) ---------- */
function lissajousPath(a, b, delta, R, cx, cy, n){
  let d = "";
  for(let i=0;i<=n;i++){
    const t = (i/n) * 2*Math.PI;
    const x = cx + R*Math.sin(a*t + delta);
    const y = cy + R*Math.sin(b*t);
    d += (i===0?"M":"L") + x.toFixed(2) + " " + y.toFixed(2) + " ";
  }
  return d.trim();
}
function renderMark(svg, stroke){
  const d = lissajousPath(3, 2, Math.PI/2, 38, 50, 50, 240);
  svg.innerHTML = '<path d="'+d+'" fill="none" stroke="'+stroke+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';
}
renderMark(document.getElementById('mark-top'), 'var(--gold)');

    }
  }
  for(const c of [c1,c2]) html+='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="5" fill="var(--gold-2)" stroke="none"/>';
  return '<svg viewBox="0 0 1000 600">'+html+'</svg>';
}

      {es:"<span class='member'>Nicolás Echániz</span><span class='role'>Presidente de AlterMundi · coautor de HIT · I+D armónica</span>",
       en:"<span class='member'>Nicolás Echániz</span><span class='role'>AlterMundi President · HIT co-author · harmonic R&amp;D</span>"},
      {es:"<span class='member'>Julián De La Reta</span><span class='role'>Creador de la Proyección del Mito Personal (PMP)</span>",
       en:"<span class='member'>Julián De La Reta</span><span class='role'>Creator of Personal Myth Projection (PMP)</span>"},
      {es:"<span class='member'>Anabella Scigliano Mattiauda</span><span class='role'>Investigación y software · app y protocolo Beacon</span>",
       en:"<span class='member'>Anabella Scigliano Mattiauda</span><span class='role'>Research &amp; software · Beacon app &amp; protocol</span>"},
      {es:"<span class='member'>Saira Asúa</span><span class='role'>Diseño de producto y operaciones</span>",
       en:"<span class='member'>Saira Asúa</span><span class='role'>Product design &amp; operations</span>"},
      {es:"<span class='member'>Federico Bonino</span><span class='role'>Ingeniería de sonido y calidad de señal</span>",

      {lab:"Web", val:"harmonicbeacon.com", href:"https://harmonicbeacon.com"},
      {lab:"Instagram", val:"@harmonic.beacon", href:"https://instagram.com/harmonic.beacon"},

/* ---------- Render ---------- */
const stage = document.getElementById('stage');
const dotsBox = document.getElementById('dots');
const L = (o)=> (typeof o === 'string') ? o
  : '<span data-lang="es">'+(o.es||'')+'</span><span data-lang="en">'+(o.en||'')+'</span>';

function buildSlide(s, i){
  const el = document.createElement('section');
  el.className = 'slide';
  el.setAttribute('role','group');
  el.setAttribute('aria-roledescription','slide');
  el.dataset.index = i;
  let h = '';
  if(s.rings){ h += '<div class="rings">'+ringsSVG()+'</div>'; }
  if((s.type==='title'||s.type==='outro') && s.img){
    h += '<div class="bgfull"><img src="img/'+s.img+'.jpg" alt="" loading="lazy"></div>';
  }
  h += '<div class="inner">';
  if(s.img && (s.type==='editorial')){
    h += '<div class="plate"><img src="img/'+s.img+'.jpg" alt="" loading="lazy"></div>';
  }
  if(s.eyebrow){ h += '<p class="eyebrow">'+L(s.eyebrow)+'</p>'; }
  if(s.title){
    const tag = (s.type==='title')?'h1':'h2';
    let t = '<'+tag+' class="title">'+L(s.title);
    if(s.titleIt){ t += '<span class="it">'+L(s.titleIt)+'</span>'; }
    t += '</'+tag+'>';
    h += t;
  }
  if(s.lede){ h += '<p class="lede">'+L(s.lede)+'</p>'; }
  if(s.title || s.eyebrow){ h += '<hr class="rule">'; }
  if(s.body){ h += '<p class="body">'+L(s.body)+'</p>'; }
  if(s.seq){
    h += '<ul class="seq'+(s.team?' team':'')+'">'+ s.seq.map(it=>'<li>'+L(it)+'</li>').join('') +'</ul>';
  }
  if(s.quotes){
    h += '<ul class="seq quotes">'+ s.quotes.map(q=>'<li>'+L(q)+'</li>').join('') +'</ul>';
  }
  if(s.contacts){
    h += '<div class="contacts">';
    for(const c of s.contacts){
      const lab = (typeof c.lab==='object') ? L(c.lab) : c.lab;
      h += '<div class="row"><span class="lab">'+lab+'</span>'+
           '<span class="val"><a href="'+c.href+'"'+(c.href.startsWith('http')?' target="_blank" rel="noopener"':'')+'>'+c.val+'</a></span></div>';
    }
    h += '</div>';
  }
  if(s.org){ h += '<p class="org">'+s.org+'</p>'; }
  h += '</div>';
  el.innerHTML = h;
  return el;
}

SLIDES.forEach((s,i)=>{
  const el = buildSlide(s,i);
  stage.appendChild(el);
  el.querySelectorAll('.mark-liss').forEach(m=> renderMark(m, 'var(--gold)'));
  const dot = document.createElement('button');
  dot.setAttribute('role','tab');
  dot.setAttribute('aria-label','Cartel '+(i+1));
  dot.addEventListener('click',()=>go(i));
  dotsBox.appendChild(dot);
});

const slides = [...stage.children];
const dots = [...dotsBox.children];
document.getElementById('total').textContent = String(slides.length).padStart(2,'0');

let cur = 0;
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const progress = document.getElementById('progress');
const curEl = document.getElementById('cur');

function go(n, fromHash){
  cur = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((sl,i)=> sl.classList.toggle('active', i===cur));
  dots.forEach((d,i)=> d.classList.toggle('on', i===cur));
  curEl.textContent = String(cur+1).padStart(2,'0');
  progress.style.width = ((cur)/(slides.length-1)*100)+'%';
  prevBtn.disabled = cur===0;
  nextBtn.disabled = cur===slides.length-1;
  if(!fromHash){ history.replaceState(null,'','#'+(cur+1)); }
}
window.addEventListener('hashchange',()=>{
  const n = parseInt(location.hash.replace('#',''),10);
  if(!isNaN(n)) go(n-1, true);
});
prevBtn.addEventListener('click',()=>go(cur-1));
nextBtn.addEventListener('click',()=>go(cur+1));

document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); go(cur+1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(cur-1); }
  else if(e.key==='Home'){ go(0); } else if(e.key==='End'){ go(slides.length-1); }
});

/* swipe táctil */
let tx=0, ty=0;
stage.addEventListener('touchstart',(e)=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
stage.addEventListener('touchend',(e)=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){ go(dx<0?cur+1:cur-1); }
}, {passive:true});

/* rueda del mouse (con debounce suave) */
let wheelLock=false;
window.addEventListener('wheel',(e)=>{
  if(wheelLock) return;
  if(Math.abs(e.deltaY)<16 && Math.abs(e.deltaX)<16) return;
  wheelLock=true; setTimeout(()=>wheelLock=false, 600);
  go(cur + ((e.deltaY>0||e.deltaX>0)?1:-1));
}, {passive:true});

/* idioma */
const html = document.documentElement;
function setLang(lang){
  if(lang!=='en') lang='es';
  html.setAttribute('data-active-lang',lang);
  html.setAttribute('lang',lang);
  document.querySelectorAll('[data-set-lang]').forEach(x=>x.classList.toggle('on', x.dataset.setLang===lang));
  prevBtn.setAttribute('aria-label', T.prev[lang]);
  nextBtn.setAttribute('aria-label', T.next[lang]);
}
document.querySelectorAll('[data-set-lang]').forEach(b=>{
  b.addEventListener('click',()=> setLang(b.dataset.setLang));
});
const qLang = new URLSearchParams(location.search).get('lang');
if(qLang) setLang(qLang);

const startN = parseInt((location.hash||'').replace('#',''),10);
go((!isNaN(startN) && startN>=1) ? startN-1 : 0, true);
</script>
